<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="icon.png">
  <style>
    body {
      margin: 0;

      background: #22123b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      padding: 32px;

      border-radius: 24px;

    a {

      padding: 12px 24px;
      background: #f43f5e;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 999px;

  <script>
    window.location.replace('./');

</head>
